<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Heroju Energijos Rezervuaras</title>

<style>
body {
    margin:0;
    background: #000;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    align-items:center;
    justify-content:center;
}

.wrapper {
    display:flex;
    gap:80px;
    align-items:center;
}

svg {
    width:420px;
    height:428px;
    flex-shrink:0;
}

.team-layer {
    transition:height 1s ease, y 1s ease;
}

.info {
    min-width:380px;
}

.info-panel {
    background:#12162a;
    border:2px solid #2a3158;
    border-radius:14px;
    padding:20px;
}

.panel-title {
    font-size:20px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:16px;
    text-align:center;
    color:#fff;
}

#teamRows {
    display: grid;
    grid-template-rows: repeat(6, auto);
    grid-auto-flow: column;
    gap: 12px 20px;
}

.team {
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-radius:30px;
    padding:12px 22px;
    margin:0;
    font-size:18px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.4);
    min-width: 350px; /* Padidintas juostelės plotis iš 280px į 350px */
    gap: 15px; /* Neleidžia pavadinimui susilieti su taškais */
}

.team .score {
    font-size:22px;
    font-weight:900;
}

.team .pts {
    font-size:12px;
    font-weight:700;
    opacity:0.85;
    margin-left:4px;
}

.total-row {
    border-top:1px solid #2a3158;
    margin-top:16px;
    padding-top:16px;
    text-align:center;
    font-size:22px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#ffd76a;
}

.status {
    display:none;
    position:fixed;
    bottom:10px;
    left:10px;
    font-size:12px;
    color:#555;
}
</style>
</head>

    <mask id="bMask" maskContentUnits="userSpaceOnUse">
        <use href="#myLogo"/>
    </mask>

    <linearGradient id="fillGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="20%" stop-color="#cc0000"/>
        <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
</defs>

<!-- Bazinis logotipo fonas -->
<use href="#myLogo"/>

<!-- Užsipildanti dalis -->
<g mask="url(#bMask)">
    <rect id="progressFill" class="team-layer" x="0" y="356" width="350" height="0" fill="url(#fillGradient)"/>
</g>

</svg>

<div class="info">
<div class="info-panel">
<div class="panel-title">Herojų energijos rezervuaras</div>
<div id="teamRows"></div>
<div class="total-row">
VISO: <span id="total">0</span> / <span id="maxVal">200</span>
</div>
</div>
</div>

</div>

<div class="status" id="status">connecting…</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1g7IucsjigydaPQk28BebMXQKmIyfvlZiK_xRp6rade0/gviz/tq?tqx=out:csv&gid=0";
const POLL_INTERVAL_MS = 1000;

// 12 visiškai skirtingų vientisų spalvų masyvas
const TEAM_COLORS = [
    "#872E2C", // 1. Raudona
    "#4C2C67", // 2. Žalia
    "#363679", // 3. Mėlyna
    "#2F566D", // 4. Gintarinė / Geltona
    "#2F5E40", // 5. Violetinė
    "#865B34", // 6. Turkio
    "#B0CE86", // 7. Oranžinė
    "#9278A3", // 8. Rožinė
    "#F6E176", // 9. Šviesiai žalia (Lime)
    "#2F566D", // 10. Indigo
    "#DB8A87", // 11. Smaragdinė
    "#B6BDD3"  // 12. Fuchsia (Aštri violetinė)
];

let teams = [];
let max = 200;

function parseCSV(text){
    const rawLines = text.trim().split("\n");
    const headerLine = rawLines[0] || "";
    let delimiter = ",";
    if (headerLine.split(";").length > headerLine.split(",").length) delimiter = ";";
    if (headerLine.split("\t").length > headerLine.split(delimiter).length) delimiter = "\t";

    const lines = rawLines.map(l => l.split(delimiter).map(c => c.replace(/^"|"$/g,"").trim()));
    const newTeams = [];

    for (let i = 1; i < lines.length; i++){
        const [label, value] = lines[i];
        if (!label) continue;
        const lower = label.toLowerCase();
        const num = parseFloat((value || "").replace(",", "."));
        if (isNaN(num)) continue;

        if (lower === "max") {
            max = num;
        } else {
            newTeams.push({ name: label, score: num });
        }
    }

    teams = newTeams;
}

const letterTop = 0;
const letterBottom = 356;
const letterHeight = letterBottom - letterTop;

function getPtsWord(num) {
    const n = Math.abs(Math.round(num));
    if (n % 100 >= 11 && n % 100 <= 19) return "TAŠKŲ";
    if (n % 10 === 1) return "TAŠKAS";
    if (n % 10 >= 2 && n % 10 <= 9) return "TAŠKAI";
    return "TAŠKŲ";
}

function render(){
    const total = teams.reduce((sum,t)=>sum+t.score,0);
    const progress = Math.max(0, Math.min(1, total / max));
    
    const MIN_VISIBLE_HEIGHT = 25; 
    let height = progress * letterHeight;
    
    if (total > 0 && height < MIN_VISIBLE_HEIGHT) {
        height = MIN_VISIBLE_HEIGHT;
    }

    const fillRect = document.getElementById("progressFill");
    fillRect.setAttribute("y", letterBottom - height);
    fillRect.setAttribute("height", height);

    const rowsContainer = document.getElementById("teamRows");
    rowsContainer.innerHTML = teams.map((team, i) => {
        const color = TEAM_COLORS[i % TEAM_COLORS.length];
        return `
            <div class="team" style="background: ${color};">
                <span>${team.name}</span>
                <span><span class="score">${team.score}</span><span class="pts">${getPtsWord(team.score)}</span></span>
            </div>
        `;
    }).join("");

    document.getElementById("total").innerHTML = total;
    document.getElementById("maxVal").innerHTML = max;
}

async function refresh(){
    const statusEl = document.getElementById("status");
    try {
        const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        parseCSV(text);
        render();
        statusEl.textContent = "live — last update " + new Date().toLocaleTimeString();
    } catch (err) {
        statusEl.textContent = "error fetching sheet: " + err.message;
        console.error(err);
    }
}

render();
refresh();
setInterval(refresh, POLL_INTERVAL_MS);
</script>
